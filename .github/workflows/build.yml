name: Build

# 태그(v1.2.3)를 올리면 Windows 설치 파일을 빌드해서 GitHub 릴리스(초안)에 올립니다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win
        shell: bash

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PongHub-windows
          path: dist/*.exe
